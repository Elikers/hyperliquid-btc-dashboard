name: Capture BTC research candles
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-public-research-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify research code before sampling
        run: |
          python -m compileall -q research
          python -m unittest discover -s research -p 'test_*.py' -q
      - name: Collect closed public candles
        run: python -m research.capture_public_btc
      - name: Evaluate seven-factor research only
        run: python -m research.evaluate_public_snapshot
      - name: Build compact paper evidence
        run: python -m research.forward_observation
      - name: Upload compact 30-day forward observations
        uses: actions/upload-artifact@v4
        with:
          name: btc-paper-evidence-${{ github.run_id }}
          path: capture-output/forward_observation.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload research-only snapshots
        uses: actions/upload-artifact@v4
        with:
          name: btc-research-candles-${{ github.run_id }}
          path: capture-output/
          retention-days: 2
          if-no-files-found: error
