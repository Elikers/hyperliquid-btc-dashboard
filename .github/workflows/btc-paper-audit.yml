name: BTC paper research daily audit
on:
  schedule:
    - cron: '28 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc-paper-audit.yml'
      - 'research/collect_forward_artifacts.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: btc-paper-research-daily-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify research safety before API reads
        run: |
          python -m compileall -q research
          python -m unittest discover -s research -p 'test_*.py' -q
      - name: Collect 24h of research-only compact GitHub artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m research.collect_forward_artifacts \
            --repo "${{ github.repository }}" \
            --hours 24 \
            --max-artifacts 110 \
            --out paper-output/daily_forward_audit.json
      - name: Upload read-only paper audit
        uses: actions/upload-artifact@v4
        with:
          name: btc-paper-audit-${{ github.run_id }}
          path: paper-output/daily_forward_audit.json
          retention-days: 90
          if-no-files-found: error
